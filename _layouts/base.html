<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body{% if page.layout %} class="layout-{{ page.layout }}{% if page.body_class %} {{ page.body_class }}{% endif %}"{% elsif page.body_class %} class="{{ page.body_class }}"{% endif %}>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
